<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Permanent+Marker&family=Reenie+Beanie&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f4ebd9;
    --cream-2: #efe3cc;
    --paper: #f8f1e1;
    --ink: #2a2320;
    --ink-soft: #4a3f39;
    --rose: #c98a8a;
    --rose-deep: #b26b6b;
    --rose-pale: #e8c9c4;
    --moss: #8a9a72;
    --mustard: #d9a441;
    --sky: #a9c1c9;
    --tape: rgba(217, 200, 140, 0.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    background: var(--cream);
    /* paper texture */
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(201,138,138,0.10), transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(138,154,114,0.08), transparent 55%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16  0 0 0 0 0.13  0 0 0 0 0.11  0 0 0 0.08 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{background: var(--rose-pale); color: var(--ink)}

  .display{font-family:'Caveat', cursive; font-weight:700; letter-spacing:-0.5px; line-height:0.95}
  .marker{font-family:'Permanent Marker', cursive; letter-spacing:0.5px}
  .hand{font-family:'Kalam', cursive}
  .beanie{font-family:'Reenie Beanie', cursive; line-height:1}

  #root{max-width:1240px; margin:0 auto; padding: 28px 32px 120px}
  @media (max-width: 720px){ #root{padding: 20px 18px 80px} }
  @media (max-width: 480px){
  nav { gap: 12px !important; }
  nav > div:last-child { gap: 14px !important; font-size: 15px !important; }
}
</style>
